name: Build OTR Dial APK

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reuse preview signing key
        uses: actions/cache@v4
        with:
          path: .preview-signing/debug.keystore
          key: otr-dial-library-preview-debug-key-v1

      - name: Require the existing preview signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.OTR_PREVIEW_KEY_BASE64 }}
        run: |
          mkdir -p .preview-signing
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > .preview-signing/debug.keystore
          fi
          if [ ! -s .preview-signing/debug.keystore ]; then
            echo 'Existing signing key unavailable. Restore OTR_PREVIEW_KEY_BASE64 or the preview key cache; do not generate a replacement.'
            exit 1
          fi

      - name: Build debug APK
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Check installable APK packaging and signature
        run: |
          python3 scripts/check-apk.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Fetch tested 2.7 for update validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/vijoos/otr-dial/actions/artifacts/11602164526/zip > upgrade-2.7.zip
          unzip -p upgrade-2.7.zip app-debug.apk > upgrade-2.7.apk
          old_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs upgrade-2.7.apk | grep 'certificate SHA-256 digest')
          new_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'certificate SHA-256 digest')
          test "$old_cert" = "$new_cert"

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test navigation, library, backup and playback on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            python3 scripts/prepare-upgrade.py
            bash -c 'gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.example.otrdial.Upgrade28Test --stacktrace; test_result=$?; adb logcat -d -s OTRPlayback OTR28_PERF TestRunner AndroidRuntime > playback-check.log; adb pull /sdcard/Download/ ui-screenshots; exit "$test_result"'

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: OTR-Dial-2.8-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload UI checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OTR-Dial-ui-checks
          path: |
            ui-screenshots/
            app/build/reports/androidTests/
            playback-check.log
