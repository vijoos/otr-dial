name: Build OTR Dial APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reuse preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: otr-dial-library-preview-debug-key-v1

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OTR-Dial-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test navigation, library, backup and playback on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Download/ ui-screenshots

      - name: Upload UI checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OTR-Dial-ui-checks
          path: |
            ui-screenshots/
            app/build/reports/androidTests/
